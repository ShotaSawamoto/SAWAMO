name: Deploy to XServer

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      retry_attempt:
        description: "Internal counter used to retry on a runner with a different egress IP."
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
      XSERVER_USER: ${{ secrets.XSERVER_USER }}
      XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
      XSERVER_HOST_KEY: ${{ secrets.XSERVER_HOST_KEY }}
      XSERVER_DEPLOY_PATH: ${{ secrets.XSERVER_DEPLOY_PATH }}
      XSERVER_SSH_PORT: "10022"
      SSH_OPTS: >-
        -i ~/.ssh/id_xserver
        -o BatchMode=yes
        -o ConnectTimeout=25
        -o ConnectionAttempts=1
        -o ServerAliveInterval=15
        -o ServerAliveCountMax=4
      # Server-managed paths that must survive an --delete sync.
      RSYNC_EXCLUDES: >-
        --exclude=.well-known/
        --exclude=.user.ini
        --exclude=.htpasswd

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -d dist/assets
          echo "dist/ contents:"
          find dist -maxdepth 2 -type f | sort

      - name: Validate deployment settings
        shell: bash
        run: |
          # Only presence, length and shape are reported - never the values.
          for name in XSERVER_HOST XSERVER_USER XSERVER_SSH_KEY XSERVER_HOST_KEY XSERVER_DEPLOY_PATH; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "$name is empty." >&2
              exit 1
            fi
            echo "$name: set (${#value} characters)"
            case "$value" in
              *[$'\r']*) echo "$name contains a carriage return (CRLF)." >&2; exit 1 ;;
            esac
          done

          case "$XSERVER_HOST" in
            *' '*|*$'\t'*) echo "XSERVER_HOST contains whitespace." >&2; exit 1 ;;
          esac
          case "$XSERVER_USER" in
            *' '*|*$'\t'*) echo "XSERVER_USER contains whitespace." >&2; exit 1 ;;
          esac
          case "$XSERVER_DEPLOY_PATH" in
            /home/*/sawamo.jp/public_html/) ;;
            *) echo "XSERVER_DEPLOY_PATH is not the expected sawamo.jp public_html path." >&2; exit 1 ;;
          esac

          if [ "$XSERVER_HOST" = "sv17179.xserver.jp" ]; then
            echo "XSERVER_HOST matches the expected XServer hostname."
          else
            echo "XSERVER_HOST does NOT match sv17179.xserver.jp (value not printed)." >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$XSERVER_SSH_KEY" > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          printf '%s\n' "$XSERVER_HOST_KEY" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          if ! ssh-keygen -y -P "" -f ~/.ssh/id_xserver > /dev/null 2>&1; then
            echo "XSERVER_SSH_KEY is invalid or protected by a passphrase." >&2
            exit 1
          fi
          echo "Deploy key fingerprint (public half only):"
          ssh-keygen -y -P "" -f ~/.ssh/id_xserver > ~/.ssh/id_xserver.pub
          ssh-keygen -lf ~/.ssh/id_xserver.pub

          if ! ssh-keygen -F "[$XSERVER_HOST]:$XSERVER_SSH_PORT" -f ~/.ssh/known_hosts > /dev/null; then
            echo "XSERVER_HOST_KEY has no entry for XSERVER_HOST on port $XSERVER_SSH_PORT." >&2
            exit 1
          fi
          echo "known_hosts entry for port $XSERVER_SSH_PORT found."

      - name: Diagnose network reachability
        id: reachability
        shell: bash
        run: |
          echo "Runner egress IP: $(curl -fsS --max-time 15 https://api.ipify.org || echo 'unavailable')"

          resolved="$(getent ahostsv4 "$XSERVER_HOST" | awk '{print $1}' | sort -u | tr '\n' ' ')"
          echo "Resolved IPv4 address(es): ${resolved:-none}"
          if [ -z "$resolved" ]; then
            echo "XSERVER_HOST does not resolve from this runner." >&2
            exit 1
          fi

          reachable=no
          for attempt in 1 2 3; do
            if timeout 20 bash -c "exec 3<>/dev/tcp/$XSERVER_HOST/$XSERVER_SSH_PORT" 2>/dev/null; then
              reachable=yes
              break
            fi
            echo "TCP attempt $attempt to port $XSERVER_SSH_PORT failed; retrying..."
            sleep $((attempt * 10))
          done

          if [ "$reachable" = yes ]; then
            echo "TCP port $XSERVER_SSH_PORT is reachable from this runner."
          else
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::error::TCP port $XSERVER_SSH_PORT is NOT reachable from this GitHub-hosted runner."
            echo "The host resolves correctly, so this is a network-level block rather than an SSH problem."
            echo "Check the XServer server panel: SSH setting is ON, and the access restriction"
            echo "(国外IPアクセス制限 / SSH アクセス許可IP) allows the runner egress IP shown above."
            exit 1
          fi

      - name: Verify destination
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ssh $SSH_OPTS -p "$XSERVER_SSH_PORT" "$XSERVER_USER@$XSERVER_HOST" \
                "test -d '$XSERVER_DEPLOY_PATH' && test -w '$XSERVER_DEPLOY_PATH' && echo 'deploy path exists and is writable'"; then
              exit 0
            fi
            echo "SSH attempt $attempt failed; retrying..."
            sleep $((attempt * 15))
          done
          echo "::error::Could not verify the deploy path over SSH after 3 attempts."
          exit 1

      - name: Preview changes on the server
        shell: bash
        run: |
          rsync -az --delete $RSYNC_EXCLUDES --dry-run --itemize-changes \
            -e "ssh $SSH_OPTS -p $XSERVER_SSH_PORT" \
            dist/ "$XSERVER_USER@$XSERVER_HOST:$XSERVER_DEPLOY_PATH"

      - name: Deploy website
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if rsync -az --delete $RSYNC_EXCLUDES \
                -e "ssh $SSH_OPTS -p $XSERVER_SSH_PORT" \
                dist/ "$XSERVER_USER@$XSERVER_HOST:$XSERVER_DEPLOY_PATH"; then
              exit 0
            fi
            echo "rsync attempt $attempt failed; retrying..."
            sleep $((attempt * 15))
          done
          echo "::error::rsync failed after 3 attempts."
          exit 1

      - name: Verify published site
        shell: bash
        run: |
          for url in https://sawamo.jp/ https://sawamo.jp/contact; do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)"
            echo "$url -> $code"
            [ "$code" = "200" ] || { echo "::error::$url returned $code"; exit 1; }
          done

      # XServer intermittently blocks some GitHub-hosted runner egress IPs at the
      # network level. Re-dispatching lands the job on a different runner IP.
      - name: Retry on a different runner IP
        if: failure() && steps.reachability.outputs.blocked == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.event.inputs.retry_attempt || '0' }}
        run: |
          next=$((ATTEMPT + 1))
          if [ "$next" -gt 3 ]; then
            echo "::error::Still blocked after $ATTEMPT automatic retries. Allow the runner IP in the XServer panel."
            exit 0
          fi
          echo "Dispatching retry $next of 3..."
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f retry_attempt="$next"
